services:
  app:
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-19289}:8000"
    volumes:
      - dispatch:/srv/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 12
volumes:
  dispatch:
